set -g mouse on
set -g history-limit 50000
set -g renumber-windows on
set -g allow-rename off

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=default,fg=colour245"

set -g status-left-length 40
set -g status-left "#[fg=colour39,bold] #S #[default]"

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=colour39,fg=colour0,bold] #I:#W #[default]"

set -g status-right-length 80
set -g status-right "#[fg=colour245]#H #[fg=colour39]%Y-%m-%d %H:%M "

# Pane borders
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour39"

# Messages and command prompt
set -g message-style "bg=colour39,fg=colour0"
set -g message-command-style "bg=colour39,fg=colour0"
